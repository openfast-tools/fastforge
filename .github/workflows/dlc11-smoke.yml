name: DLC 1.1 smoke

# Cheap end-to-end pipeline check triggered on every push and pull-request
# to main. Delegates to the reusable dlc11-sweep.yml workflow with
# dlc_smoke.txt. controller_repo / controller_tag and openfast_repo /
# openfast_version are user inputs when triggered manually; push/PR runs use
# the sweep workflow defaults.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      wind_speed:
        description: 'Wind speed (m/s) to patch into dlc_smoke.txt (leave blank for default 12 m/s)'
        type: string
        default: ''
      controller_repo:
        description: 'Repository containing the controller release (owner/repo)'
        type: string
        default: 'NatLabRockies/ROSCO'
      controller_tag:
        description: 'Release tag to download the controller from'
        type: string
        default: 'v2.9.0'
      openfast_repo:
        description: 'Repository hosting the OpenFAST + TurbSim release assets (owner/repo). May be private.'
        type: string
        default: 'OpenFAST/openfast'
      openfast_version:
        description: 'OpenFAST release tag (in openfast_repo)'
        type: string
        default: 'v4.2.0'

concurrency:
  group: dlc11-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/dlc11-sweep.yml
    secrets: inherit
    with:
      dlc_file:        'dlc_smoke.txt'
      controller_repo: ${{ inputs.controller_repo || 'NatLabRockies/ROSCO' }}
      controller_tag:  ${{ inputs.controller_tag  || 'v2.9.0' }}
      openfast_repo:    ${{ inputs.openfast_repo    || 'OpenFAST/openfast' }}
      openfast_version: ${{ inputs.openfast_version || 'v4.2.0' }}
      wind_speed:      ${{ inputs.wind_speed }}
