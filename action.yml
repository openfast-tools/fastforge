name: 'Run one OpenFAST simulation case'
description: >-
  Given a pre-prepared fastprep campaign directory (the campaign-setup artifact),
  run TurbSim (skipped for STD/steady cases) and OpenFAST for a single .fst case,
  then upload the .outb as a workflow artifact.

inputs:
  fst_rel_path:
    description: >-
      Path to the .fst file relative to the campaign directory root,
      e.g. FST/DLC1.1/DLC1.1_NTM_U12_S01_Yaw000_IA00.fst
    required: true
  campaign_dir:
    description: >-
      Absolute path to the downloaded campaign directory,
      e.g. /home/runner/work/repo/campaign_setup
    required: true
  openfast_repo:
    description: >-
      Repository (owner/repo) whose GitHub release hosts openfast_x64.exe and
      TurbSim_x64.exe. Defaults to the official OpenFAST/openfast; may be a
      private repo (then github_token must be able to read it).
    required: false
    default: 'OpenFAST/openfast'
  openfast_version:
    description: 'Release tag in openfast_repo to download the binaries from'
    required: false
    default: 'v4.2.0'
  github_token:
    description: >-
      Token used by the GitHub CLI to download the release assets. Needed when
      openfast_repo is private. Falls back to the workflow's github.token
      (enough for public repos) when left empty.
    required: false
    default: ''
  upload_artifact:
    description: 'Upload the .outb as a workflow artifact (true/false)'
    required: false
    default: 'true'
  artifact_retention_days:
    description: 'Retention period for per-case .outb artifacts (days)'
    required: false
    default: '90'

outputs:
  case_stem:
    description: '.fst filename without extension (e.g. DLC1.1_NTM_U12_S01_Yaw000_IA00)'
    value: ${{ steps.derive.outputs.case_stem }}
  outb_path:
    description: 'Absolute path to the produced .outb file (empty if not produced)'
    value: ${{ steps.openfast.outputs.outb_path }}

runs:
  using: 'composite'
  steps:

    # ------------------------------------------------------------------
    # 1. Derive case stem, wind stem, and paths from the .fst rel path
    # ------------------------------------------------------------------
    - name: Derive case and wind identifiers
      id: derive
      shell: pwsh
      run: |
        $fstRelPath  = '${{ inputs.fst_rel_path }}'
        $campaignDir = '${{ inputs.campaign_dir }}'

        # Normalise separators
        $fstRelPath  = $fstRelPath.Replace('/', '\')
        $campaignDir = $campaignDir.TrimEnd('\/')

        $fstAbsPath = Join-Path $campaignDir $fstRelPath
        if (-not (Test-Path $fstAbsPath)) {
          throw "FST file not found: $fstAbsPath"
        }

        # Case stem  = filename without .fst
        $caseStem = [System.IO.Path]::GetFileNameWithoutExtension($fstAbsPath)

        # Wind stem  = strip "<DLC_ID>_" prefix and "_Yaw..._IA..." suffix
        # e.g.  DLC1.1_NTM_U04_S01_Yaw000_IA00  ->  NTM_U04_S01
        $windStem = $caseStem -replace '^DLC[^_]+_', '' -replace '_Yaw.*$', ''

        # STD (steady) cases have no Wind .inp — detect by absence of the file
        $windInpPath = Join-Path $campaignDir "Wind\$windStem.inp"
        $isStd       = -not (Test-Path $windInpPath)

        # Directory that contains the .fst (OpenFAST runs from here)
        $fstDir = Split-Path $fstAbsPath -Parent

        # Wind directory
        $windDir = Join-Path $campaignDir 'Wind'

        Write-Host "case_stem    : $caseStem"
        Write-Host "wind_stem    : $windStem"
        Write-Host "is_std       : $isStd"
        Write-Host "fst_dir      : $fstDir"
        Write-Host "wind_inp     : $windInpPath"

        "case_stem=$caseStem"                               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "wind_stem=$windStem"                               | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "is_std=$($isStd.ToString().ToLower())"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "fst_dir=$fstDir"                                   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "wind_dir=$windDir"                                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # ------------------------------------------------------------------
    # 2. Cache / download OpenFAST + TurbSim binaries
    # ------------------------------------------------------------------
    - name: Validate OpenFAST source
      id: of_src
      shell: pwsh
      env:
        OF_REPO: ${{ inputs.openfast_repo }}
        OF_TAG:  ${{ inputs.openfast_version }}
      run: |
        # Values arrive through the environment (never interpolated into the
        # script text) so an odd repo/tag string cannot inject commands.
        if ($env:OF_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
          throw "openfast_repo must be in 'owner/repo' form, got '$($env:OF_REPO)'"
        }
        if ([string]::IsNullOrWhiteSpace($env:OF_TAG)) {
          throw "openfast_version (release tag) must not be empty"
        }
        # '/' -> '__' so the repo can be embedded in a cache key
        $slug = $env:OF_REPO.Replace('/', '__')
        Write-Host "OpenFAST source : $($env:OF_REPO) @ $($env:OF_TAG)"
        "repo_slug=$slug" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # Cache key = repo + tag, so the same tag in two different repos (e.g. the
    # official v4.2.0 vs a private build also tagged v4.2.0) never share an entry.
    - name: Cache OpenFAST + TurbSim binaries
      id: cache_bins
      uses: actions/cache@v6
      with:
        path: ${{ github.action_path }}/.bin
        key: openfast-turbsim-${{ steps.of_src.outputs.repo_slug }}-${{ inputs.openfast_version }}-win64

    - name: Download OpenFAST + TurbSim binaries
      if: steps.cache_bins.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        # gh authenticates with this token; required for private repos.
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        OF_REPO:  ${{ inputs.openfast_repo }}
        OF_TAG:   ${{ inputs.openfast_version }}
      run: |
        $bin = Join-Path '${{ github.action_path }}' '.bin'
        New-Item -ItemType Directory -Force -Path $bin | Out-Null

        Write-Host "Downloading OpenFAST + TurbSim from $($env:OF_REPO) @ $($env:OF_TAG) ..."
        gh release download $env:OF_TAG `
          --repo $env:OF_REPO `
          --pattern 'openfast_x64.exe' `
          --pattern 'TurbSim_x64.exe' `
          --dir $bin `
          --clobber
        if ($LASTEXITCODE -ne 0) {
          throw "Could not download release '$($env:OF_TAG)' from '$($env:OF_REPO)' (gh exit code $LASTEXITCODE). For a private repo, check that github_token can read it."
        }

        # Both assets must be present; a release that lacks one would otherwise
        # fail later with a much less obvious error.
        foreach ($f in 'openfast_x64.exe', 'TurbSim_x64.exe') {
          if (-not (Test-Path (Join-Path $bin $f))) {
            throw "Release '$($env:OF_TAG)' of '$($env:OF_REPO)' has no asset named '$f'"
          }
        }
        Get-ChildItem $bin | Format-Table Name, @{N='Size (MB)';E={[math]::Round($_.Length/1MB,1)}}

    # ------------------------------------------------------------------
    # 3. Run TurbSim (skipped for STD / steady-wind cases)
    # ------------------------------------------------------------------
    - name: Run TurbSim
      if: steps.derive.outputs.is_std != 'true'
      shell: pwsh
      run: |
        $turbsim  = Join-Path '${{ github.action_path }}' '.bin\TurbSim_x64.exe'
        $windDir  = '${{ steps.derive.outputs.wind_dir }}'
        $windStem = '${{ steps.derive.outputs.wind_stem }}'
        $inpFile  = "$windStem.inp"

        Write-Host "Running TurbSim: $inpFile"
        Push-Location $windDir
        try {
          & $turbsim $inpFile
          if ($LASTEXITCODE -ne 0) { throw "TurbSim failed (exit code $LASTEXITCODE)" }
        } finally {
          Pop-Location
        }
        Write-Host "TurbSim outputs:"
        Get-ChildItem $windDir -Filter "$windStem.*" |
          Format-Table Name, @{N='Size (MB)';E={[math]::Round($_.Length/1MB,1)}}

    # ------------------------------------------------------------------
    # 4. Run OpenFAST
    # ------------------------------------------------------------------
    - name: Run OpenFAST
      id: openfast
      shell: pwsh
      run: |
        $openfast  = Join-Path '${{ github.action_path }}' '.bin\openfast_x64.exe'
        $fstDir    = '${{ steps.derive.outputs.fst_dir }}'
        $caseStem  = '${{ steps.derive.outputs.case_stem }}'
        $fstFile   = "$caseStem.fst"

        Write-Host "Running OpenFAST: $fstFile"
        Push-Location $fstDir
        try {
          & $openfast $fstFile
          if ($LASTEXITCODE -ne 0) { throw "OpenFAST failed (exit code $LASTEXITCODE)" }
        } finally {
          Pop-Location
        }

        $outb = Join-Path $fstDir "$caseStem.outb"
        if (Test-Path $outb) {
          $sizeMB = [math]::Round((Get-Item $outb).Length / 1MB, 1)
          Write-Host "Output: $outb ($sizeMB MB)"
          "outb_path=$outb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          Write-Host "No .outb found (write_binary_output may be 0)"
          "outb_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }

        $out = Join-Path $fstDir "$caseStem.out"
        if (Test-Path $out) {
          "out_path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          "out_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }

    # ------------------------------------------------------------------
    # 5a. Upload this case's inputs + outputs as one bundle
    #
    # Bundles the .fst (+ the wind .inp it references) alongside whatever
    # outputs OpenFAST produced (.outb and/or ASCII .out), so the whole
    # thing can be downloaded and manually re-run later without hunting
    # down inputs from a separate, short-lived artifact. Runs whenever the
    # case reached the OpenFAST step at all (always(), not success()) so a
    # case that fails mid-run still uploads its inputs for inspection —
    # "Upload diagnostics on failure" below additionally captures
    # failure-specific files (.sum/.ech/.log) on top of this.
    # ------------------------------------------------------------------
    - name: Upload case bundle (inputs + outputs)
      if: always() && inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: case-${{ steps.derive.outputs.case_stem }}
        path: |
          ${{ steps.derive.outputs.fst_dir }}/${{ steps.derive.outputs.case_stem }}.fst
          ${{ steps.derive.outputs.fst_dir }}/${{ steps.derive.outputs.case_stem }}.outb
          ${{ steps.derive.outputs.fst_dir }}/${{ steps.derive.outputs.case_stem }}.out
          ${{ steps.derive.outputs.wind_dir }}/${{ steps.derive.outputs.wind_stem }}.inp
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact_retention_days }}

    # ------------------------------------------------------------------
    # 5b. Upload diagnostics on failure
    # ------------------------------------------------------------------
    - name: Upload diagnostics on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failed-${{ steps.derive.outputs.case_stem }}
        path: |
          ${{ steps.derive.outputs.fst_dir }}/*.sum
          ${{ steps.derive.outputs.fst_dir }}/*.ech
          ${{ steps.derive.outputs.fst_dir }}/*.log
          ${{ steps.derive.outputs.fst_dir }}/*.fst
          ${{ steps.derive.outputs.fst_dir }}/*_IW.dat
          ${{ steps.derive.outputs.wind_dir }}/${{ steps.derive.outputs.wind_stem }}.inp
        if-no-files-found: warn
        retention-days: 14
